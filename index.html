<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTG — Change to Green</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f0a;
            color: #e8f0e8;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141c14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e7a2e;
            border-radius: 4px;
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(10, 15, 10, 0.95);
            backdrop-filter: blur(16px);
            padding: 18px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(30, 122, 46, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #e8f0e8;
        }
        .logo span {
            color: #1e7a2e;
        }

        nav a {
            text-decoration: none;
            color: #a0b8a0;
            font-weight: 500;
            margin-left: 32px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            text-transform: uppercase;
        }
        nav a:hover {
            color: #1e7a2e;
        }

        .btn-nav {
            background: transparent;
            border: 1px solid #1e7a2e;
            color: #1e7a2e;
            padding: 8px 24px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-nav:hover {
            background: #1e7a2e;
            color: #0a0f0a;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ===== HERO ===== */
        .hero {
            padding: 40px 0 20px;
            border-bottom: 1px solid rgba(30, 122, 46, 0.12);
            margin-bottom: 48px;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #e8f0e8;
        }
        .hero h1 span {
            color: #1e7a2e;
        }
        .hero p {
            font-size: 1rem;
            color: #7a9a7a;
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ===== SECTION HEADERS ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 48px 0 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(30, 122, 46, 0.15);
        }

        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #e8f0e8;
        }
        .section-header h2 span {
            color: #1e7a2e;
        }

        .btn-add {
            background: transparent;
            border: 1px solid #1e7a2e;
            color: #1e7a2e;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-add:hover {
            background: #1e7a2e;
            color: #0a0f0a;
        }

        /* ===== SESSIONS GRID ===== */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .session-card {
            background: #111811;
            border: 1px solid rgba(30, 122, 46, 0.12);
            border-radius: 8px;
            padding: 22px 24px;
            transition: all 0.3s;
        }
        .session-card:hover {
            border-color: rgba(30, 122, 46, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .session-card .category {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1e7a2e;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .session-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e8f0e8;
        }
        .session-card .desc {
            color: #7a9a7a;
            font-size: 0.85rem;
            margin: 4px 0 12px;
            font-weight: 300;
        }

        .session-card .timer {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e7a2e;
            font-variant-numeric: tabular-nums;
            background: rgba(30, 122, 46, 0.08);
            padding: 4px 14px;
            border-radius: 4px;
            display: inline-block;
            margin: 6px 0 14px;
            letter-spacing: 2px;
        }

        .session-card .btn-session {
            background: transparent;
            border: 1px solid #1e7a2e;
            color: #1e7a2e;
            padding: 4px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 6px;
        }
        .session-card .btn-session:hover {
            background: #1e7a2e;
            color: #0a0f0a;
        }

        .session-card .btn-delete {
            background: transparent;
            border: 1px solid #5a2a2a;
            color: #8a4a4a;
            padding: 4px 14px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .session-card .btn-delete:hover {
            background: #5a2a2a;
            color: #e8f0e8;
        }

        /* ===== TEAM ===== */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 8px;
        }

        .team-card {
            background: #111811;
            border: 1px solid rgba(30, 122, 46, 0.08);
            border-radius: 6px;
            padding: 18px 16px;
            text-align: center;
            transition: all 0.3s;
        }
        .team-card:hover {
            border-color: rgba(30, 122, 46, 0.2);
        }
        .team-card .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #e8f0e8;
        }
        .team-card .role {
            font-size: 0.7rem;
            color: #1e7a2e;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ===== VOLUNTEERS ===== */
        .volunteer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .volunteer-card {
            background: #111811;
            border: 1px solid rgba(30, 122, 46, 0.08);
            border-radius: 6px;
            padding: 18px 20px;
            transition: all 0.3s;
        }
        .volunteer-card:hover {
            border-color: rgba(30, 122, 46, 0.2);
        }

        .volunteer-card .vname {
            font-weight: 700;
            font-size: 1rem;
            color: #e8f0e8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .volunteer-card .vname .badge {
            font-size: 0.6rem;
            background: #1e7a2e;
            color: #0a0f0a;
            padding: 2px 12px;
            border-radius: 2px;
            font-weight: 700;
        }
        .volunteer-card .vmentor {
            font-size: 0.75rem;
            color: #1e7a2e;
            font-weight: 500;
            margin: 2px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .volunteer-card .task-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #7a9a7a;
        }
        .volunteer-card .task-status .done {
            color: #1e7a2e;
            font-weight: 700;
        }
        .volunteer-card .task-status .pending {
            color: #b87a2a;
            font-weight: 700;
        }
        .btn-task {
            background: rgba(30, 122, 46, 0.12);
            border: none;
            padding: 4px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            color: #1e7a2e;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 8px;
            margin-right: 6px;
        }
        .btn-task:hover {
            background: #1e7a2e;
            color: #0a0f0a;
        }
        .btn-task-xp {
            background: rgba(184, 122, 42, 0.15);
            border: none;
            padding: 4px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            color: #b87a2a;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }
        .btn-task-xp:hover {
            background: #b87a2a;
            color: #0a0f0a;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #111811;
            border: 1px solid rgba(30, 122, 46, 0.2);
            border-radius: 8px;
            padding: 36px 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e8f0e8;
            margin-bottom: 20px;
        }
        .modal-content label {
            font-weight: 500;
            display: block;
            margin: 14px 0 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a9a7a;
        }
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 10px 14px;
            background: #0a0f0a;
            border: 1px solid rgba(30, 122, 46, 0.15);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: #e8f0e8;
            transition: border 0.3s;
        }
        .modal-content input:focus,
        .modal-content select:focus {
            border-color: #1e7a2e;
            outline: none;
        }
        .modal-content input::placeholder {
            color: #3a5a3a;
        }
        .modal-content select option {
            background: #0a0f0a;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-actions .btn-confirm {
            background: #1e7a2e;
            color: #0a0f0a;
        }
        .modal-actions .btn-confirm:hover {
            background: #2a9a3e;
        }
        .modal-actions .btn-cancel {
            background: #2a2a2a;
            color: #7a9a7a;
        }
        .modal-actions .btn-cancel:hover {
            background: #3a3a3a;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 32px 10px 16px;
            color: #3a5a3a;
            font-size: 0.75rem;
            border-top: 1px solid rgba(30, 122, 46, 0.08);
            margin-top: 48px;
            letter-spacing: 0.5px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
                padding: 14px 20px;
                justify-content: center;
            }
            nav a {
                margin: 0 12px;
                font-size: 0.7rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .container {
                padding: 20px 16px;
            }
            .sessions-grid {
                grid-template-columns: 1fr;
            }
            .team-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            .volunteer-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                padding: 24px 18px;
            }
            .section-header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.4rem;
            }
            .session-card .timer {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">CTG <span>·</span> Change to Green</div>
        <nav>
            <a href="#sessions">Sessions</a>
            <a href="#team">Team</a>
            <a href="#volunteers">Volunteers</a>
        </nav>
        <button class="btn-nav" onclick="openModal()">New Session</button>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <h1>Change to <span>Green</span></h1>
            <p>Operational dashboard · Track sessions, team performance & volunteer progress.</p>
        </section>

        <!-- ===== SESSIONS ===== -->
        <section id="sessions">
            <div class="section-header">
                <h2>📋 Active <span>Sessions</span></h2>
                <button class="btn-add" onclick="openModal()">+ Add</button>
            </div>
            <div class="sessions-grid" id="sessionsGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <!-- ===== TEAM ===== -->
        <section id="team">
            <div class="section-header">
                <h2>👥 Leadership <span>Team</span></h2>
            </div>
            <div class="team-grid" id="teamGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <!-- ===== VOLUNTEERS ===== -->
        <section id="volunteers">
            <div class="section-header">
                <h2>🌟 Volunteers <span>& XP</span></h2>
            </div>
            <div class="volunteer-grid" id="volunteerGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <footer>
            CTG · Change to Green © 2026 — Operational Dashboard
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="sessionModal">
        <div class="modal-content">
            <h2>New Session</h2>
            <label>Session Name</label>
            <input type="text" id="sessionName" placeholder="e.g. Waste Management" />

            <label>Category</label>
            <select id="sessionCategory">
                <option value="Waste">Waste</option>
                <option value="Climate">Climate</option>
                <option value="Energy">Energy</option>
                <option value="Biodiversity">Biodiversity</option>
            </select>

            <label>Description</label>
            <input type="text" id="sessionDesc" placeholder="Brief description" />

            <div class="modal-actions">
                <button class="btn-confirm" onclick="addSession()">Add</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA
        // ============================================================

        let sessions = [{
            id: 1,
            name: 'Waste Management Workshop',
            category: 'Waste',
            description: 'Reduce, reuse, recycle — practical solutions.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 2,
            name: 'Climate Action Summit',
            category: 'Climate',
            description: 'Policy discussions and community action.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 3,
            name: 'Renewable Energy Expo',
            category: 'Energy',
            description: 'Solar, wind, and green innovations.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 4,
            name: 'Biodiversity Conservation',
            category: 'Biodiversity',
            description: 'Ecosystem and wildlife protection.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }];

        let sessionIdCounter = 5;

        const team = [
            { name: 'Youssef El-Banna', role: 'Founder' },
            { name: 'Kamilya Sherif', role: 'Executive Director' },
            { name: 'Jessica', role: 'Accounts & Trainer' },
            { name: 'Islam', role: 'Trainer' },
            { name: 'Shahnda', role: 'Trainer' },
            { name: 'Mariam', role: 'Trainer' },
            { name: 'Adham', role: 'Trainer' },
            { name: 'Genny', role: 'Trainer' },
            { name: 'Mahinour', role: 'Trainer' }
        ];

        let volunteers = [{
            id: 1,
            name: 'Aser',
            mentor: 'Islam',
            xp: 450,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 2,
            name: 'Gidaa',
            mentor: 'Shahnda',
            xp: 320,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 3,
            name: 'Sohaila',
            mentor: 'Shahnda',
            xp: 280,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 4,
            name: 'Yamani',
            mentor: 'Mariam',
            xp: 510,
            tasksDone: 4,
            tasksTotal: 5
        }, {
            id: 5,
            name: 'Rahma',
            mentor: 'Mariam',
            xp: 390,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 6,
            name: 'Yasmin',
            mentor: 'Jessica',
            xp: 210,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 7,
            name: 'Youstina',
            mentor: 'Jessica',
            xp: 340,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 8,
            name: 'Omar',
            mentor: 'Adham',
            xp: 470,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 9,
            name: 'Rodina',
            mentor: 'Genny',
            xp: 300,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 10,
            name: 'Kady',
            mentor: 'Mahinour',
            xp: 260,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 11,
            name: 'Mariam',
            mentor: 'Kamilya',
            xp: 580,
            tasksDone: 4,
            tasksTotal: 5
        }];

        // ============================================================
        // RENDER
        // ============================================================

        function renderSessions() {
            const grid = document.getElementById('sessionsGrid');
            grid.innerHTML = sessions.map(s => `
                        <div class="session-card">
                            <div class="category">${s.category}</div>
                            <h3>${s.name}</h3>
                            <div class="desc">${s.description}</div>
                            <div class="timer" id="timer-${s.id}">${formatTime(s.timer)}</div>
                            <div>
                                <button class="btn-session" onclick="toggleTimer(${s.id})">${s.isRunning ? 'Pause' : 'Start'}</button>
                                <button class="btn-session" onclick="resetTimer(${s.id})">Reset</button>
                                <button class="btn-delete" onclick="deleteSession(${s.id})">Delete</button>
                            </div>
                        </div>
                    `).join('');
        }

        function renderTeam() {
            const grid = document.getElementById('teamGrid');
            grid.innerHTML = team.map(m => `
                        <div class="team-card">
                            <div class="name">${m.name}</div>
                            <div class="role">${m.role}</div>
                        </div>
                    `).join('');
        }

        function renderVolunteers() {
            const grid = document.getElementById('volunteerGrid');
            grid.innerHTML = volunteers.map(v => `
                        <div class="volunteer-card">
                            <div class="vname">
                                ${v.name}
                                <span class="badge">${v.xp} XP</span>
                            </div>
                            <div class="vmentor">Mentor: ${v.mentor}</div>
                            <div class="task-status">
                                Tasks: <span class="${v.tasksDone >= v.tasksTotal ? 'done' : 'pending'}">${v.tasksDone}/${v.tasksTotal}</span>
                                ${v.tasksDone >= v.tasksTotal ? 'Complete' : 'In progress'}
                            </div>
                            <div>
                                <button class="btn-task" onclick="completeTask(${v.id})">Complete Task</button>
                                <button class="btn-task-xp" onclick="addXP(${v.id})">+10 XP</button>
                            </div>
                        </div>
                    `).join('');
        }

        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ============================================================
        // SESSION ACTIONS
        // ============================================================

        function toggleTimer(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;

            if (session.isRunning) {
                clearInterval(session.timerInterval);
                session.isRunning = false;
            } else {
                session.isRunning = true;
                session.timerInterval = setInterval(() => {
                    session.timer++;
                    const el = document.getElementById(`timer-${id}`);
                    if (el) el.textContent = formatTime(session.timer);
                }, 1000);
            }
            renderSessions();
        }

        function resetTimer(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            clearInterval(session.timerInterval);
            session.isRunning = false;
            session.timer = 0;
            renderSessions();
        }

        function deleteSession(id) {
            if (!confirm('Delete this session?')) return;
            const session = sessions.find(s => s.id === id);
            if (session) clearInterval(session.timerInterval);
            sessions = sessions.filter(s => s.id !== id);
            renderSessions();
        }

        // ============================================================
        // MODAL
        // ============================================================

        function openModal() {
            document.getElementById('sessionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('sessionModal').classList.remove('active');
            document.getElementById('sessionName').value = '';
            document.getElementById('sessionDesc').value = '';
        }

        function addSession() {
            const name = document.getElementById('sessionName').value.trim();
            const category = document.getElementById('sessionCategory').value;
            const description = document.getElementById('sessionDesc').value.trim();

            if (!name) {
                alert('Please enter a session name.');
                return;
            }

            sessions.push({
                id: sessionIdCounter++,
                name: name,
                category: category,
                description: description || 'No description',
                timer: 0,
                timerInterval: null,
                isRunning: false
            });

            closeModal();
            renderSessions();
        }

        // ============================================================
        // VOLUNTEER ACTIONS
        // ============================================================

        function completeTask(id) {
            const v = volunteers.find(vol => vol.id === id);
            if (!v) return;
            if (v.tasksDone < v.tasksTotal) {
                v.tasksDone++;
                v.xp += 15;
                renderVolunteers();
            } else {
                alert('All tasks completed!');
            }
        }

        function addXP(id) {
            const v = volunteers.find(vol => vol.id === id);
            if (!v) return;
            v.xp += 10;
            renderVolunteers();
        }

        // ============================================================
        // INIT
        // ============================================================

        renderSessions();
        renderTeam();
        renderVolunteers();

        console.log('CTG Dashboard loaded.');
    </script>

</body>
</html>
