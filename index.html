<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change to Green 🌱</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0faf0;
            color: #1a2e1a;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #d4edda;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e7d32;
            border-radius: 10px;
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #2e7d32;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1e4a1e;
        }
        .logo span {
            color: #2e7d32;
        }
        .logo i {
            font-style: normal;
            animation: pulseLeaf 2s ease-in-out infinite;
        }

        @keyframes pulseLeaf {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.1) rotate(8deg);
            }
        }

        nav a {
            text-decoration: none;
            color: #1e3a1e;
            font-weight: 600;
            margin-left: 28px;
            transition: color 0.3s;
            font-size: 0.95rem;
        }
        nav a:hover {
            color: #2e7d32;
        }

        .btn-nav {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .btn-nav:hover {
            background: #1e5a1e;
            transform: scale(1.04);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 40px 20px 30px;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1e4a1e, #2e7d32);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.2rem;
            color: #3d5a3d;
            margin-top: 10px;
        }

        /* ===== SESSIONS ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 50px 0 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 800;
        }
        .section-header h2 span {
            color: #2e7d32;
        }

        .btn-add {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-add:hover {
            background: #1e5a1e;
            transform: scale(1.04);
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.3);
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .session-card {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(46, 125, 50, 0.06);
            border: 1px solid rgba(46, 125, 50, 0.08);
            transition: all 0.3s;
            position: relative;
        }
        .session-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(46, 125, 50, 0.12);
        }

        .session-card .icon {
            font-size: 2.6rem;
            margin-bottom: 8px;
        }
        .session-card h3 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .session-card .desc {
            color: #3d5a3d;
            font-size: 0.92rem;
            margin-bottom: 12px;
        }

        .session-card .timer {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2e7d32;
            font-variant-numeric: tabular-nums;
            background: #e8f5e9;
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 10px 0 14px;
        }

        .session-card .btn-session {
            background: transparent;
            border: 2px solid #2e7d32;
            color: #2e7d32;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 8px;
        }
        .session-card .btn-session:hover {
            background: #2e7d32;
            color: #fff;
        }

        .session-card .btn-delete {
            background: transparent;
            border: 2px solid #d32f2f;
            color: #d32f2f;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .session-card .btn-delete:hover {
            background: #d32f2f;
            color: #fff;
        }

        /* ===== TEAM ===== */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0 40px;
        }

        .team-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid rgba(46, 125, 50, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            transition: all 0.3s;
        }
        .team-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(46, 125, 50, 0.1);
        }
        .team-card .avatar {
            font-size: 3rem;
            margin-bottom: 6px;
        }
        .team-card .name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .team-card .role {
            font-size: 0.82rem;
            color: #2e7d32;
            font-weight: 600;
            background: #e8f5e9;
            padding: 2px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== VOLUNTEERS ===== */
        .volunteer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .volunteer-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(46, 125, 50, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            transition: all 0.3s;
        }
        .volunteer-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(46, 125, 50, 0.1);
        }
        .volunteer-card .vname {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volunteer-card .vname .badge {
            font-size: 0.7rem;
            background: #2e7d32;
            color: #fff;
            padding: 2px 12px;
            border-radius: 40px;
        }
        .volunteer-card .vmentor {
            font-size: 0.85rem;
            color: #2e7d32;
            font-weight: 600;
            margin: 4px 0 8px;
        }
        .volunteer-card .xp {
            font-weight: 800;
            color: #1e4a1e;
            font-size: 1.2rem;
        }
        .volunteer-card .task-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .volunteer-card .task-status .done {
            color: #2e7d32;
            font-weight: 700;
        }
        .volunteer-card .task-status .pending {
            color: #f57c00;
            font-weight: 700;
        }
        .btn-task {
            background: #e8f5e9;
            border: none;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            color: #1e4a1e;
            transition: all 0.3s;
            margin-top: 6px;
        }
        .btn-task:hover {
            background: #2e7d32;
            color: #fff;
        }

        /* ===== ADD SESSION MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 40px 36px;
            border-radius: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .modal-content label {
            font-weight: 600;
            display: block;
            margin: 12px 0 4px;
        }
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d4edda;
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border 0.3s;
        }
        .modal-content input:focus,
        .modal-content select:focus {
            border-color: #2e7d32;
            outline: none;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-content .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .modal-content .modal-actions .btn-confirm {
            background: #2e7d32;
            color: #fff;
        }
        .modal-content .modal-actions .btn-confirm:hover {
            background: #1e5a1e;
        }
        .modal-content .modal-actions .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
        .modal-content .modal-actions .btn-cancel:hover {
            background: #ccc;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
                padding: 14px 20px;
                justify-content: center;
            }
            nav a {
                margin: 0 10px;
                font-size: 0.85rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .section-header h2 {
                font-size: 1.5rem;
            }
            .sessions-grid {
                grid-template-columns: 1fr;
            }
            .team-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            .volunteer-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.6rem;
            }
            .modal-content {
                padding: 24px 18px;
            }
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 10px 20px;
            color: #3d5a3d;
            border-top: 1px solid rgba(46, 125, 50, 0.08);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">
            <i>🌿</i> Change <span>to</span> Green
        </div>
        <nav>
            <a href="#sessions">Sessions</a>
            <a href="#team">Team</a>
            <a href="#volunteers">Volunteers</a>
        </nav>
        <button class="btn-nav" onclick="openModal()">➕ New Session</button>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <h1>🌍 Change to Green</h1>
            <p>Together for a sustainable future — Track our sessions, team, and volunteers.</p>
        </section>

        <!-- ===== SESSIONS ===== -->
        <section id="sessions">
            <div class="section-header">
                <h2>📋 Our <span>Sessions</span></h2>
                <button class="btn-add" onclick="openModal()">➕ Add Session</button>
            </div>
            <div class="sessions-grid" id="sessionsGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <!-- ===== TEAM ===== -->
        <section id="team" style="margin-top:50px;">
            <h2 style="font-size:2rem;font-weight:800;margin-bottom:20px;">👥 <span style="color:#2e7d32;">Leadership</span> Team</h2>
            <div class="team-grid" id="teamGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <!-- ===== VOLUNTEERS ===== -->
        <section id="volunteers" style="margin-top:50px;">
            <h2 style="font-size:2rem;font-weight:800;margin-bottom:20px;">🌟 <span style="color:#2e7d32;">Volunteers</span> & XP</h2>
            <div class="volunteer-grid" id="volunteerGrid">
                <!-- Rendered by JS -->
            </div>
        </section>

        <footer>
            © 2026 Change to Green — Growing hope, harvesting the future 💚
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="sessionModal">
        <div class="modal-content">
            <h2>➕ New Session</h2>
            <label>Session Name</label>
            <input type="text" id="sessionName" placeholder="e.g. Waste Management Workshop" />

            <label>Category</label>
            <select id="sessionCategory">
                <option value="Waste">♻️ Waste</option>
                <option value="Climate">🌤️ Climate</option>
                <option value="Energy">⚡ Energy</option>
                <option value="Biodiversity">🌿 Biodiversity</option>
            </select>

            <label>Description</label>
            <input type="text" id="sessionDesc" placeholder="Brief description..." />

            <div class="modal-actions">
                <button class="btn-confirm" onclick="addSession()">✅ Add Session</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA
        // ============================================================

        // ---- SESSIONS ----
        let sessions = [{
            id: 1,
            name: 'Waste Management Workshop',
            category: 'Waste',
            description: 'Reduce, reuse, recycle — practical waste solutions.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 2,
            name: 'Climate Action Summit',
            category: 'Climate',
            description: 'Discussing climate policies and community action.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 3,
            name: 'Renewable Energy Expo',
            category: 'Energy',
            description: 'Solar, wind, and green energy innovations.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }, {
            id: 4,
            name: 'Biodiversity Conservation',
            category: 'Biodiversity',
            description: 'Protecting ecosystems and wildlife habitats.',
            timer: 0,
            timerInterval: null,
            isRunning: false
        }];

        let sessionIdCounter = 5;

        // ---- TEAM ----
        const team = [
            { name: 'Youssef El-Banna', role: 'Founder', emoji: '👨‍💼' },
            { name: 'Camellia Sherif', role: 'Executive Director', emoji: '👩‍💼' },
            { name: 'Jessica', role: 'Accounts & Trainer', emoji: '🧑‍🏫' },
            { name: 'Islam', role: 'Trainer', emoji: '👨‍🏫' },
            { name: 'Shahnda', role: 'Trainer', emoji: '👩‍🏫' },
            { name: 'Mariam', role: 'Trainer', emoji: '👩‍🏫' },
            { name: 'Adham', role: 'Trainer', emoji: '👨‍🏫' },
            { name: 'Genny', role: 'Trainer', emoji: '👩‍🏫' },
            { name: 'Mahi', role: 'Trainer', emoji: '👩‍🏫' }
        ];

        // ---- VOLUNTEERS ----
        let volunteers = [{
            id: 1,
            name: 'Aser',
            mentor: 'Islam',
            xp: 450,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 2,
            name: 'Gidaa',
            mentor: 'Shahnda',
            xp: 320,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 3,
            name: 'Sohaila',
            mentor: 'Shahnda',
            xp: 280,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 4,
            name: 'Yamani',
            mentor: 'Mariam',
            xp: 510,
            tasksDone: 4,
            tasksTotal: 5
        }, {
            id: 5,
            name: 'Rahma',
            mentor: 'Mariam',
            xp: 390,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 6,
            name: 'Yasmin',
            mentor: 'Jessica',
            xp: 210,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 7,
            name: 'Youstina',
            mentor: 'Jessica',
            xp: 340,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 8,
            name: 'Omar',
            mentor: 'Adham',
            xp: 470,
            tasksDone: 3,
            tasksTotal: 5
        }, {
            id: 9,
            name: 'Rodina',
            mentor: 'Genny',
            xp: 300,
            tasksDone: 2,
            tasksTotal: 4
        }, {
            id: 10,
            name: 'Kady',
            mentor: 'Mahinour',
            xp: 260,
            tasksDone: 1,
            tasksTotal: 4
        }, {
            id: 11,
            name: 'Mariam (vol)',
            mentor: 'Camellia',
            xp: 580,
            tasksDone: 4,
            tasksTotal: 5
        }];

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        function renderSessions() {
            const grid = document.getElementById('sessionsGrid');
            grid.innerHTML = sessions.map(s => `
                        <div class="session-card">
                            <div class="icon">${getCategoryIcon(s.category)}</div>
                            <h3>${s.name}</h3>
                            <div class="desc">${s.description}</div>
                            <div class="timer" id="timer-${s.id}">${formatTime(s.timer)}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:6px;">
                                <button class="btn-session" onclick="toggleTimer(${s.id})">${s.isRunning ? '⏸️ Pause' : '▶️ Start'}</button>
                                <button class="btn-session" onclick="resetTimer(${s.id})">🔄 Reset</button>
                                <button class="btn-delete" onclick="deleteSession(${s.id})">🗑️</button>
                            </div>
                        </div>
                    `).join('');
        }

        function renderTeam() {
            const grid = document.getElementById('teamGrid');
            grid.innerHTML = team.map(m => `
                        <div class="team-card">
                            <div class="avatar">${m.emoji}</div>
                            <div class="name">${m.name}</div>
                            <div class="role">${m.role}</div>
                        </div>
                    `).join('');
        }

        function renderVolunteers() {
            const grid = document.getElementById('volunteerGrid');
            grid.innerHTML = volunteers.map(v => `
                        <div class="volunteer-card">
                            <div class="vname">
                                ${v.name}
                                <span class="badge">${v.xp} XP</span>
                            </div>
                            <div class="vmentor">👨‍🏫 Mentor: ${v.mentor}</div>
                            <div class="task-status">
                                📋 Tasks: <span class="${v.tasksDone >= v.tasksTotal ? 'done' : 'pending'}">${v.tasksDone}/${v.tasksTotal}</span>
                                ${v.tasksDone >= v.tasksTotal ? ' ✅ Complete!' : ' ⏳ In progress'}
                            </div>
                            <button class="btn-task" onclick="completeTask(${v.id})">✅ Complete a Task</button>
                            <button class="btn-task" style="background:#fff3e0;color:#e65100;" onclick="addXP(${v.id})">⭐ +10 XP</button>
                        </div>
                    `).join('');
        }

        function getCategoryIcon(cat) {
            const map = {
                'Waste': '♻️',
                'Climate': '🌤️',
                'Energy': '⚡',
                'Biodiversity': '🌿'
            };
            return map[cat] || '📌';
        }

        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ============================================================
        // SESSION ACTIONS
        // ============================================================

        function toggleTimer(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;

            if (session.isRunning) {
                clearInterval(session.timerInterval);
                session.isRunning = false;
            } else {
                session.isRunning = true;
                session.timerInterval = setInterval(() => {
                    session.timer++;
                    const el = document.getElementById(`timer-${id}`);
                    if (el) el.textContent = formatTime(session.timer);
                }, 1000);
            }
            renderSessions();
        }

        function resetTimer(id) {
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            clearInterval(session.timerInterval);
            session.isRunning = false;
            session.timer = 0;
            renderSessions();
        }

        function deleteSession(id) {
            if (!confirm('Delete this session?')) return;
            const session = sessions.find(s => s.id === id);
            if (session) clearInterval(session.timerInterval);
            sessions = sessions.filter(s => s.id !== id);
            renderSessions();
        }

        // ============================================================
        // ADD SESSION (MODAL)
        // ============================================================

        function openModal() {
            document.getElementById('sessionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('sessionModal').classList.remove('active');
            document.getElementById('sessionName').value = '';
            document.getElementById('sessionDesc').value = '';
        }

        function addSession() {
            const name = document.getElementById('sessionName').value.trim();
            const category = document.getElementById('sessionCategory').value;
            const description = document.getElementById('sessionDesc').value.trim();

            if (!name) {
                alert('Please enter a session name.');
                return;
            }

            sessions.push({
                id: sessionIdCounter++,
                name: name,
                category: category,
                description: description || 'No description',
                timer: 0,
                timerInterval: null,
                isRunning: false
            });

            closeModal();
            renderSessions();
        }

        // ============================================================
        // VOLUNTEER ACTIONS
        // ============================================================

        function completeTask(id) {
            const v = volunteers.find(vol => vol.id === id);
            if (!v) return;
            if (v.tasksDone < v.tasksTotal) {
                v.tasksDone++;
                v.xp += 15;
                renderVolunteers();
            } else {
                alert('✅ All tasks completed! Great job!');
            }
        }

        function addXP(id) {
            const v = volunteers.find(vol => vol.id === id);
            if (!v) return;
            v.xp += 10;
            renderVolunteers();
        }

        // ============================================================
        // INIT
        // ============================================================

        renderSessions();
        renderTeam();
        renderVolunteers();

        console.log('🌿 Change to Green — Platform loaded successfully!');
    </script>

</body>
</html>
